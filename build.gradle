plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'design.inherent'
base.archivesName = 'skyweave-compat'
def reformVersion = providers.gradleProperty('reform_version').get()
def reformSha256 = providers.gradleProperty('reform_sha256').get()
def reformMinimum = providers.gradleProperty('reform_minimum').get()
def reformModule = 'reform-neoforge-1.21.1'
def reformRepository = providers.gradleProperty('reform_repository')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    exclusiveContent {
        forRepository {
            if (reformRepository.isPresent()) maven { url = uri(reformRepository.get()) }
            else ivy {
                name = 'reformRelease'
                url = uri('https://github.com/mannie-exe/reform/releases/download')
                patternLayout { artifact 'v[revision]/reform-[revision]-mc1.21.1-neoforge.[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeModule 'design.inherent', reformModule }
    }
    mavenCentral()
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
        metadataSources { artifact() }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.architectury.dev' }
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
}
neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('runs/client') }
        server { server(); gameDirectory = file('runs/server'); programArgument '--nogui' }
    }
    mods { skyweave_compat { sourceSet(sourceSets.main) } }
}
configurations {
    localRuntime
    veilSource
    aeronauticsSource
    sodiumSource
    irisSource
    flywheelSource
    analogSource
    c2meSource
    accessoriesLayerSource
    runtimeClasspath.extendsFrom localRuntime
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
