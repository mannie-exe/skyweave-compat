tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    archiveFileName = "skyweave-compat-${version}-mc1.21.1-neoforge.jar"
    from 'LICENSE', 'NOTICE'
    from('licenses') { into 'licenses' }
}
tasks.named('sourcesJar', Jar) { from 'LICENSE', 'NOTICE'; from('licenses') { into 'licenses' } }
tasks.register('preparePackagedClient') {
    group = 'verification'
    description = 'Prepare native launch inputs for disposable packaged-client probes without launching Minecraft.'
    dependsOn 'prepareClientRun'
    def destination = layout.buildDirectory.file('moddev/clientRunClasspath.json')
    outputs.file destination
    outputs.upToDateWhen { false }
    doLast {
        def client = tasks.named('runClient', JavaExec).get()
        if (client.mainClass.get() != 'net.neoforged.devlaunch.Main')
            throw new GradleException('Review the changed native ModDev client bootstrap before launching probes')
        // ModDev assigns this collection to JavaExec only inside RunGameTask.exec().
        def classpath = client.classpathProvider.asPath
        if (classpath.isEmpty()) throw new GradleException('The pinned ModDev client classpath is empty')
        destination.get().asFile.setText(groovy.json.JsonOutput.toJson([
            schemaVersion: 1, arguments: ['-cp', classpath]
        ]) + '\n', 'UTF-8')
    }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    inputs.property 'reform_version', reformVersion
    inputs.property 'reform_sha256', reformSha256
    inputs.property 'reform_minimum', reformMinimum
    inputs.property 'neo_version', neo_version
    inputs.property 'fml_version', fml_version
    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/skyweave-compat-development.properties']) {
        expand version: project.version, reform_version: reformVersion, reform_sha256: reformSha256, reform_minimum: reformMinimum, neo_version: neo_version, fml_version: fml_version
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.register('verifyUpstream') {
