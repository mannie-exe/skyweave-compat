    inputs.files(configurations.runtimeClasspath)
    inputs.files(configurations.compileClasspath)
    doLast {
        ['net.neoforged.fancymodloader:loader': fml_version, ("design.inherent:${reformModule}"): reformVersion].each { coordinate, expected ->
            def artifact = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
                "${it.moduleVersion.id.group}:${it.name}" == coordinate
            }
            if (artifact == null || artifact.moduleVersion.id.version != expected)
                throw new GradleException("Development metadata for ${coordinate} must match the resolved version ${expected}")
        }
        def reformArtifact = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'design.inherent' && it.name == reformModule
        }.file
        if (!(reformSha256 ==~ /[0-9a-f]{64}/) || java.security.MessageDigest.getInstance('SHA-256').digest(reformArtifact.bytes).encodeHex().toString() != reformSha256)
            throw new GradleException('Unexpected re:form development artifact digest')
        def quests = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'dev.ftb.mods' && it.name == 'ftb-quests-neoforge'
        }?.file
        if (quests == null || java.security.MessageDigest.getInstance('SHA-256').digest(quests.bytes).encodeHex().toString()
                != '3752657a82c69b0a80c034700df86f1a3d7c5f3e3aad814b5af748b9082a834b')
            throw new GradleException('Unexpected FTB Quests compile-only dependency')
